plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smsbridge.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.smsbridge.mobile'
        minSdk 26
        targetSdk 36
        versionCode 29
        versionName '1.3.12'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
